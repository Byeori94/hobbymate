<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" th:content="${noticeCreateView.clubName + ' 공지사항 작성'}">
    <title th:text="${noticeCreateView.clubName + ' 공지사항 작성 | HobbyMate'}">
        공지사항 작성 | HobbyMate
    </title>
    <link rel="stylesheet" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/club-nav.css}">
    <link rel="stylesheet" th:href="@{/css/pages/club-notice-list.css}">
    <link rel="stylesheet" th:href="@{/css/pages/club-notice-form.css}">
    <script defer th:src="@{/js/common/header.js}"></script>
    <script defer th:src="@{/js/common/club-nav.js}"></script>
    <script defer th:src="@{/js/pages/club-notice-form.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="club-notice-page">
    <nav class="club-notice-breadcrumb" aria-label="모임 탐색 경로">
        <a th:href="@{/clubs/{clubId}/notices(clubId=${noticeCreateView.clubId})}">
            ← 공지사항 목록으로
        </a>
    </nav>

    <section class="club-notice-shell" aria-labelledby="notice-form-title">
        <header class="club-notice-club-heading">
            <p>CLUB BOARD</p>
            <strong th:text="${noticeCreateView.clubName}">주말 독서 모임</strong>
        </header>

        <div th:replace="~{fragments/club-nav :: clubNav(
                clubId=${noticeCreateView.clubId},
                activeMenu=${activeClubMenu},
                canManage=${noticeCreateView.canManageClub})}">
        </div>

        <div class="club-notice-form-content">
            <header class="notice-form-heading">
                <p>NOTICE</p>
                <h1 id="notice-form-title">공지사항 작성</h1>
                <span>모임 회원에게 안내할 중요한 내용을 작성해 주세요.</span>
            </header>

            <form class="notice-create-form"
                  th:action="@{/clubs/{clubId}/notices(clubId=${noticeCreateView.clubId})}"
                  th:object="${noticeCreateRequest}"
                  method="post"
                  data-notice-create-form>
                <div class="notice-form-error-summary"
                     th:if="${#fields.hasGlobalErrors()}"
                     role="alert">
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                        입력값을 확인해 주세요.
                    </p>
                </div>

                <div class="notice-form-field">
                    <label for="title">
                        제목 <span aria-hidden="true">*</span>
                    </label>
                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           minlength="2"
                           maxlength="200"
                           autocomplete="off"
                           required
                           aria-describedby="title-help title-error">
                    <div class="notice-field-meta">
                        <p id="title-help">2자 이상 200자 이하로 입력해 주세요.</p>
                    </div>
                    <p id="title-error"
                       class="notice-field-error"
                       th:errors="*{title}">
                    </p>
                </div>

                <div class="notice-form-field">
                    <label for="content">
                        내용 <span aria-hidden="true">*</span>
                    </label>
                    <textarea id="content"
                              th:field="*{content}"
                              minlength="10"
                              maxlength="10000"
                              rows="16"
                              required
                              aria-describedby="content-help content-error"></textarea>
                    <div class="notice-field-meta">
                        <p id="content-help">일반 텍스트로 10자 이상 10,000자 이하로 작성해 주세요.</p>
                        <span data-content-count>0 / 10,000</span>
                    </div>
                    <p id="content-error"
                       class="notice-field-error"
                       th:errors="*{content}">
                    </p>
                </div>

                <fieldset class="notice-publish-option">
                    <legend>게시 설정</legend>
                    <label for="pinnedYn">
                        <input id="pinnedYn"
                               type="checkbox"
                               name="pinnedYn"
                               value="Y"
                               th:checked="${noticeCreateRequest.pinnedYn == 'Y'}"
                               aria-describedby="pinned-help pinned-error">
                        <span>
                            <strong>상단 고정</strong>
                            <small id="pinned-help">
                                중요한 공지를 게시판 상단에 고정합니다.
                                게시판별로 최대 5개까지 등록할 수 있습니다.
                            </small>
                        </span>
                    </label>
                    <p id="pinned-error"
                       class="notice-field-error"
                       th:errors="*{pinnedYn}">
                    </p>
                </fieldset>

                <div class="notice-form-actions">
                    <a class="notice-form-cancel"
                       th:href="@{/clubs/{clubId}/notices(clubId=${noticeCreateView.clubId})}">
                        취소
                    </a>
                    <button class="notice-form-submit"
                            type="submit"
                            data-submit-button>
                        공지 등록
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
