<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>공지사항을 찾을 수 없습니다 | HobbyMate</title>
    <link rel="stylesheet" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/pages/club-detail.css}">
    <script defer th:src="@{/js/common/header.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="club-detail-page error-page">
    <section class="not-found-card" aria-labelledby="notice-not-found-title">
        <span class="not-found-mark" aria-hidden="true">HM</span>
        <h1 id="notice-not-found-title">공지사항을 찾을 수 없습니다.</h1>
        <p th:text="${errorMessage}">
            존재하지 않거나 확인할 수 없는 공지사항입니다.
        </p>
        <a class="back-to-list-button" th:href="@{/clubs}">모임 목록으로 돌아가기</a>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
